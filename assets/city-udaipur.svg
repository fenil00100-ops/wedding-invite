<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="udrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0f21" />
      <stop offset="100%" stop-color="#19040d" />
    </linearGradient>
    <linearGradient id="udrGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4d6" />
      <stop offset="50%" stop-color="#c9a45c" />
      <stop offset="100%" stop-color="#886529" />
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#udrBg)" rx="16" />
  <circle cx="100" cy="85" r="50" fill="#fdfae5" opacity="0.15" />

  <!-- Udaipur City Palace Chhatris (Domes) on Lake -->
  <!-- Main Palace dome -->
  <path d="M 85 85 C 85 65, 115 65, 115 85 Z" fill="url(#udrGold)" />
  <rect x="88" y="85" width="24" height="20" fill="url(#udrGold)" />
  <!-- Finial -->
  <line x1="100" y1="58" x2="100" y2="65" stroke="url(#udrGold)" stroke-width="2" />
  
  <!-- Left Side Chhatri -->
  <path d="M 45 95 C 45 80, 65 80, 65 95 Z" fill="url(#udrGold)" opacity="0.9" />
  <rect x="48" y="95" width="14" height="15" fill="url(#udrGold)" opacity="0.9" />

  <!-- Right Side Chhatri -->
  <path d="M 135 95 C 135 80, 155 80, 155 95 Z" fill="url(#udrGold)" opacity="0.9" />
  <rect x="138" y="95" width="14" height="15" fill="url(#udrGold)" opacity="0.9" />

  <!-- Palace Balcony Jharokhas -->
  <rect x="30" y="110" width="140" height="18" fill="url(#udrGold)" />
  <line x1="30" y1="115" x2="170" y2="115" stroke="#4a1525" stroke-width="1.5" />

  <!-- Lake Pichola water & boat -->
  <rect x="20" y="128" width="160" height="6" fill="#651731" />
  <path d="M 40 134 Q 100 137, 160 134" stroke="url(#udrGold)" stroke-width="1" stroke-dasharray="4,3" fill="none" />
  
  <!-- Floating royal shikara boat -->
  <path d="M 85 131 Q 100 136, 115 131 Z" fill="url(#udrGold)" />

  <!-- Label -->
  <text x="100" y="168" font-family="'Cinzel', serif" font-size="12" font-weight="700" letter-spacing="3" fill="url(#udrGold)" text-anchor="middle">UDAIPUR</text>
  <text x="100" y="182" font-family="'Montserrat', sans-serif" font-size="8" letter-spacing="1.5" fill="#fcf4f3" opacity="0.8" text-anchor="middle">CITY OF LAKES</text>
</svg>
